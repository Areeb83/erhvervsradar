name: Tests

on:
  push:
  pull_request:

jobs:
  web:
    name: Netlify site and function
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  python:
    name: Python crawler and Streamlit app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
