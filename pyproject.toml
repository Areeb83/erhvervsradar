[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "erhvervsradar"
version = "0.1.0"
description = "A polite crawler that collects Danish commercial lease listings into one clean dataset."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Areeb Abbas" }]
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "typer>=0.12",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# Only needed if a site stops sending its listings in the plain HTML
# and the page has to be rendered in a real (headless) browser.
browser = ["playwright>=1.45"]
# The upload web app (app.py).
app = ["streamlit>=1.40"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
erhvervsradar = "erhvervsradar.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# Typer's Option()/Argument() defaults are the documented way to declare CLI options.
extend-immutable-calls = ["typer.Option", "typer.Argument"]
